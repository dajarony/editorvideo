[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegs-automontaje"
version = "0.2.0"
description = "Automontaje de vídeo con narración TTS, ducking de música, transiciones reales y subtítulos por Whisper."
readme = "doc/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dajarony" }]
keywords = ["video", "tts", "edge-tts", "whisper", "ffmpeg", "automontaje", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "edge-tts>=6.1.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
# Whisper arrastra PyTorch (varios GB): solo hace falta para los subtítulos automáticos.
subtitulos = [
    "openai-whisper>=20231117",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
aegs = "main:main_cli"

[project.urls]
Repository = "https://github.com/dajarony/editorvideo"
Issues = "https://github.com/dajarony/editorvideo/issues"

# Disposición plana: se declara qué se instala (sin esto setuptools encuentra
# `modulos` y `plantillas` y se niega a construir el paquete).
[tool.setuptools]
py-modules = ["main", "configuracion"]
packages = ["modulos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "internet: necesita red (Edge TTS real); solo se ejecuta con AEGS_TEST_INTERNET=1",
]
